
name: Build Sam Ng APK

on:
  workflow_dispatch:
  push:
    paths:
      - "main.py"
      - "buildozer.spec"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: "platform-tools"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git zip unzip \
            autoconf automake libtool \
            pkg-config cmake \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Check project files
        run: |
          test -f main.py
          test -f buildozer.spec

      - name: Configure Buildozer SDK license
        run: |
          if grep -q '^android.accept_sdk_license[[:space:]]*=' buildozer.spec; then
            sed -i 's/^android.accept_sdk_license[[:space:]]*=.*/android.accept_sdk_license = True/' buildozer.spec
          else
            printf '\nandroid.accept_sdk_license = True\n' >> buildozer.spec
          fi

      - name: Build Android APK
        run: |
          buildozer -v android debug

      - name: Verify APK
        if: success()
        run: |
          test -n "$(find bin -maxdepth 1 -name '*.apk' -print -quit)" || {
            echo "ERROR: Build finished without producing an APK."
            exit 1
          }

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sam-Ng-APK
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 7

