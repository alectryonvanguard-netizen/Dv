
name: Build Sam Ng APK

on:
  workflow_dispatch:
  push:
    paths:
      - "main.py"
      - "buildozer.spec"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
    ANDROID_HOME: ${{ runner.home }}/.buildozer/android/platform/android-sdkANDROID_SDK_ROOT: ${{ runner.home }}/.buildozer/android/platform/android-sdk
    ANDROIDSDK: ${{ runner.home }}/.buildozer/android/platform/android-sdk

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Android SDK and accept licenses
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            autoconf automake libtool pkg-config cmake \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 libffi-dev libssl-dev \
            libc6:i386 libstdc++6:i386 zlib1g:i386

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Configure Buildozer
        shell: bash
        run: |
          test -f main.py
          test -f buildozer.spec

          if grep -qE '^[[:space:]]*android.sdk_path[[:space:]]*=' buildozer.spec; then
            sed -i "s|^[[:space:]]*android.sdk_path[[:space:]]*=.*|android.sdk_path = $ANDROID_HOME|" buildozer.spec
          else
            printf '\nandroid.sdk_path = %s\n' "$ANDROID_HOME" >> buildozer.spec
          fi

          if grep -qE '^[[:space:]]*android.accept_sdk_license[[:space:]]*=' buildozer.spec; then
            sed -i 's/^[[:space:]]*android.accept_sdk_license[[:space:]]*=.*/android.accept_sdk_license = True/' buildozer.spec
          else
            printf '\nandroid.accept_sdk_license = True\n' >> buildozer.spec
          fi

      - name: Verify AIDL installation
        shell: bash
        run: |
          AIDL="$ANDROID_HOME/build-tools/35.0.0/aidl"

          echo "Android SDK: $ANDROID_HOME"
          echo "Checking: $AIDL"

          if [ ! -x "$AIDL" ]; then
            echo "ERROR: AIDL is missing from the configured SDK."
            echo "Installed Build Tools:"
            ls -la "$ANDROID_HOME/build-tools" || true
            exit 1
          fi

          echo "AIDL executable found."
          "$AIDL" --version

      - name: Build Android APK
        run: buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sam-Ng-APK
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 7

